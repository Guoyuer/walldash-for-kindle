name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Check plugin and run Lua tests
        run: sh tools/check.sh
      - name: Check shell and Python syntax
        run: |
          for script in tools/*.sh kdev/*.sh documents/*.sh; do
            sh -n "$script" || exit 1
          done
          python3 -m compileall -q tools
